<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FruitSlot Eluru – order today, pick up fresh tomorrow</title>
<meta name="theme-color" content="#1E4D2B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5EC;--surface:#FFFFFF;--ink:#17261B;--muted:#56665A;--leaf:#1E4D2B;--pom:#B3123A;--on-pom:#FFFFFF;
  --tag:#F4C430;--line:#D7E0D2;--ok:#2F7D46;--warn:#B07000;--bad:#B3123A;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1711;--surface:#18221B;--ink:#E7F0E8;--muted:#9AAE9F;--leaf:#8FD19F;--pom:#F2557A;--on-pom:#22000A;
  --tag:#E8B923;--line:#2A392E;--ok:#7CCB92;--warn:#E3B04B;--bad:#F2557A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1711;--surface:#18221B;--ink:#E7F0E8;--muted:#9AAE9F;--leaf:#8FD19F;--pom:#F2557A;--on-pom:#22000A;
  --tag:#E8B923;--line:#2A392E;--ok:#7CCB92;--warn:#E3B04B;--bad:#F2557A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo Tammudu 2","Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;padding:0 16px 130px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0}
.top .title{font-weight:700;font-size:1.1rem}
.brand{display:flex;align-items:baseline;gap:8px}
.mark{font-weight:700;font-size:1.55rem;color:var(--leaf);letter-spacing:-.01em}
.town{color:var(--muted)}
.link{background:none;border:0;color:var(--leaf);font-weight:600;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.intro h1{font-size:2rem;line-height:1.08;margin:6px 0 6px;font-weight:700;max-width:16ch}
.intro p{margin:0;color:var(--muted)}
.intro .clock{margin-top:12px;display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink);font-weight:500}
.fruits{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:10px}
.fruit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:48px 1fr auto;column-gap:12px;row-gap:6px;align-items:center}
.fname{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.fname strong{font-size:1.12rem}
.fname span{color:var(--muted);font-size:.95rem}
.tag{position:relative;background:var(--tag);color:#2A1D00;padding:4px 10px 2px 20px;border-radius:4px 10px 10px 4px;transform:rotate(-3deg);white-space:nowrap}
.tag::before{content:"";position:absolute;left:7px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--surface)}
.tag b{font-size:1.3rem;font-weight:700}
.tag small{font-size:.85rem}
.qtyzone{grid-column:2/4;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px}
.note{color:var(--muted);font-size:.92rem;margin:0}
.add,.primary,.ghost{border-radius:10px;border:0;min-height:42px;padding:0 20px;font-weight:600}
.add{background:var(--leaf);color:var(--surface)}
.primary{background:var(--pom);color:var(--on-pom)}
.wide{display:block;width:100%;min-height:52px;font-size:1.05rem}
.ghost{background:transparent;border:1.5px solid var(--line);min-height:36px;padding:0 12px}
.stepper{display:flex;align-items:center;border:1.5px solid var(--leaf);border-radius:10px;overflow:hidden}
.stepper button{background:transparent;border:0;color:var(--leaf);min-height:40px;padding:0 15px;font-size:1.35rem;font-weight:600}
.stepper output{min-width:68px;text-align:center;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar-in strong{font-size:1.3rem;display:block;line-height:1.1}
.bar-in span{color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.lines em{font-style:normal;color:var(--muted)}
.total{display:flex;justify-content:space-between;padding-top:10px;font-size:1.15rem}
.form label,.lbl{display:block;font-weight:600;margin-bottom:12px}
.in{display:block;width:100%;margin-top:4px;font:inherit;font-weight:500;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
fieldset{border:0;padding:0;margin:0 0 8px}
legend{font-weight:600;margin-bottom:6px;padding:0}
.choice{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-weight:500;cursor:pointer}
.choice:has(input:checked){border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 10%,transparent)}
.choice input{accent-color:var(--leaf);width:18px;height:18px}
.err{color:var(--bad);min-height:1.3em;margin:4px 0 10px;font-weight:600}
.amount{font-size:2.7rem;font-weight:700;margin:0;color:var(--pom);line-height:1}
.steps{padding-left:22px;margin:16px 0 8px}
.steps li{margin-bottom:14px;padding-left:4px}
.upi{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
code{font-family:inherit;font-weight:600;background:var(--bg);padding:3px 8px;border-radius:6px;word-break:break-all}
details summary{cursor:pointer;color:var(--leaf);font-weight:600;padding:6px 0}
#qr{background:#fff;padding:12px;display:inline-block;border-radius:10px;margin:8px 0}
.done{text-align:center;padding:48px 8px}
.done h1{margin:0 0 8px;line-height:1.15}
.tick{width:72px;height:72px;border-radius:50%;background:var(--leaf);color:var(--surface);display:grid;place-items:center;margin:0 auto 16px}
.olist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.order,.tray,.fedit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.order{border-left:5px solid var(--warn)}
.order.paid{border-left-color:var(--ok)}
.order.picked{border-left-color:var(--line)}
.order.rejected{border-left-color:var(--bad)}
.order p,.tray p{margin:4px 0}
.oamt{font-size:1.9rem;font-weight:700;margin:4px 0;color:var(--pom);line-height:1.1}
button.big{font-size:1.15rem;min-height:58px}
.ohead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:.85rem;padding:2px 10px;border-radius:999px;background:var(--bg);font-weight:600;white-space:nowrap}
.order a{color:var(--leaf)}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.actions button{min-height:40px;padding:0 14px;border-radius:9px;font-weight:600;border:1.5px solid var(--line);background:transparent}
.actions .yes{background:var(--leaf);color:var(--surface);border-color:var(--leaf)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0 4px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 4px;font-size:.95rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pom)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters label{flex:1;min-width:140px;font-weight:600;font-size:.9rem}
.summary{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0;color:var(--muted)}
.summary strong{color:var(--ink)}
.thead{display:flex;justify-content:space-between;gap:8px}
.bars{display:flex;gap:6px;margin:10px 0}
.tbar{flex:1;height:14px;border-radius:4px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--pom)}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fhead svg{width:32px;height:32px}
.switch{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:.92rem;font-weight:600}
.switch input{accent-color:var(--leaf);width:18px;height:18px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
[hidden]{display:none!important}
.in{min-width:0}
.fgrid label{font-size:.85rem;font-weight:600}
.banner{background:color-mix(in srgb,var(--tag) 28%,var(--surface));border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:.95rem}
.foot{margin-top:28px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;color:var(--muted);font-size:.9rem}
.empty{color:var(--muted);text-align:center;padding:32px 8px}
.unsaved{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-top:2px solid var(--pom);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.unsaved[hidden]{display:none}
.unsaved strong{font-size:1rem}
.unsaved .primary{min-height:44px}
.hidlbl{margin:0 0 8px;font-size:.88rem;font-weight:700;color:var(--muted)}
.hidlbl[hidden]{display:none}
.onsale{margin:0 0 10px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.toast.show{opacity:1}
.bkh{font-size:1.15rem;margin:22px 0 8px}
.bkgrid{display:grid;grid-template-columns:1fr 70px 62px 76px;gap:6px;align-items:center;margin-bottom:6px}
.bkgrid.three{grid-template-columns:1fr 54px 76px 70px}
.bkgrid.head{font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.bkname{font-weight:600;line-height:1.15}
.bkname small{color:var(--muted);font-weight:500}
.in.sm{margin:0;padding:8px;text-align:center}
.had{text-align:center;color:var(--muted);font-weight:600}
.sum{margin-top:16px}
.sum .lines + .lines{margin-top:8px}
.good{color:var(--ok)} .bad{color:var(--bad)}
.warn{margin:6px 0 0;color:var(--warn);font-weight:600;font-size:.92rem}
.days{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.days li{display:grid;grid-template-columns:96px 1fr 92px;gap:8px;align-items:center}
.dbar{height:14px;background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--ok)}
.dbar i.neg{background:var(--bad)}
.dval{text-align:right;font-weight:600}
.bk-pick{display:grid;gap:8px}
.bk-seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.bk-seg button,.bk-date{flex:1;border:0;background:none;border-radius:9px;min-height:44px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative;font-size:.98rem}
.bk-seg .on{background:var(--leaf);color:var(--surface)}
.bk-date input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.bk-for{margin:10px 0 8px}
.bk-for .note{margin-left:6px}
.bk-steps{list-style:none;padding:0;margin:0 0 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bk-steps button{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:.82rem;line-height:1.1;text-align:center}
.bk-steps small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.bk-steps .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:.95rem}
.bk-steps .done .num{background:var(--ok);color:var(--surface)}
.bk-steps .on{border-color:var(--pom);box-shadow:0 0 0 1px var(--pom)}
.bk-steps .on .num{background:var(--pom);color:var(--on-pom)}
.bk-say{font-size:1.08rem;margin:0 0 12px}
.bk-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.bk-item.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.bk-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:1.08rem}
.bk-head svg,.bk-head img{width:32px;height:32px;flex:0 0 auto}
.bk-had{margin-left:auto;color:var(--muted);font-size:.95rem;text-align:right}
.bk-had b{color:var(--ink)}
.bk-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.bk-line > span:first-child{color:var(--muted);font-weight:500;line-height:1.2}
.bk-num{display:inline-flex;align-items:center;gap:6px}
.bk-num .in{width:96px;margin:0;text-align:center;font-size:1.1rem;font-weight:600;padding:8px}
.bk-num em{font-style:normal;color:var(--muted);font-weight:600}
.bk-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bk-two label{font-weight:600;color:var(--muted);font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.bk-two .bk-num .in{width:100%}
.bk-two .bk-num{width:100%}
.bk-big{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:1.02rem}
.bk-big .bk-num .in{width:100%;font-size:1.4rem;padding:10px}
.bk-big .bk-num{width:100%}
.bk-hint{margin:6px 0 0;color:var(--muted);font-size:.92rem}
.bk-sold{margin:8px 0 0;min-height:1.3em;color:var(--ok)}
.bk-progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 8px}
.bk-progress span{display:block;height:100%;background:var(--ok)}
.bk-more summary{color:var(--leaf);font-weight:600;padding:8px 0 12px;cursor:pointer}
.bk-result{text-align:center;background:color-mix(in srgb,var(--ok) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line));border-radius:16px;padding:18px;margin-bottom:10px}
.bk-result small{display:block;color:var(--muted);font-weight:600;font-size:.95rem}
.bk-result strong{font-size:2.6rem;line-height:1.1;color:var(--ok)}
.bk-result.loss{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.bk-result.loss strong{color:var(--bad)}
.bk-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.bk-opts button{min-height:68px;font-size:1.25rem;font-weight:700;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 8px}
.bk-opts button.on{border-color:var(--leaf);background:var(--leaf);color:var(--surface)}
.bk-order{font-size:1.35rem;line-height:1.5;font-weight:700;margin:0 0 6px}
.bk-trow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:1.02rem}
.bk-trow:first-of-type{border-top:0}
.bk-trow small{display:block;color:var(--muted);font-weight:400}
.bk-sum{list-style:none;margin:0;padding:0}
.bk-sum li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.bk-sum li.sub{border:0;padding-top:0;color:var(--muted);font-size:.9rem}
.bk-sum li:last-child{border-bottom:0}
.bk-warn{display:block;width:100%;text-align:left;background:color-mix(in srgb,var(--tag) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--tag) 60%,var(--line));border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:600}
.bk-warn u{color:var(--leaf);margin-left:4px}
.bk-back{min-height:48px;padding:0 18px}
.ai-wrap{padding-bottom:20px}
.ai-top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.ai-intro{margin:0 0 12px;color:var(--muted);font-size:.95rem}
.ai-spark{color:var(--pom);font-weight:700}
.ai-log{display:flex;flex-direction:column;gap:10px}
.ai-msg{display:flex;flex-direction:column;max-width:88%}
.ai-msg.me{align-self:flex-end;align-items:flex-end}
.ai-msg.bot{align-self:flex-start}
.ai-b{padding:10px 13px;border-radius:16px;line-height:1.4;word-wrap:break-word;overflow-wrap:anywhere}
.me .ai-b{background:var(--leaf);color:var(--surface);border-bottom-right-radius:5px}
.bot .ai-b{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.ai-li{display:block;padding-left:14px;position:relative}
.ai-li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
.ai-card{margin-top:6px;background:var(--surface);border:1.5px solid var(--tag);border-radius:14px;padding:10px 12px}
.ai-card-h{margin:0 0 6px;font-weight:700;font-size:.9rem}
.ai-card ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ai-card li{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:.95rem;line-height:1.3}
.ai-card li.applied .ai-st{color:var(--ok);font-weight:700}
.ai-card li.cancelled{opacity:.55}
.ai-card li.error .ai-st{color:var(--bad);font-weight:700}
.ai-card em{font-style:normal;font-size:.85rem}
.ai-card li.ai-grp{display:flex;justify-content:space-between;gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:.95rem}
.ai-card li.ai-sum{display:block;margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--bg,#f2f5ec);font-size:.95rem}
.ai-thumb{display:block;max-width:150px;max-height:150px;border-radius:10px;margin-bottom:6px}
.ai-prev{position:relative;display:inline-block;margin:0 0 8px}
.ai-prev img{display:block;height:64px;width:auto;max-width:120px;border-radius:10px;border:1px solid var(--line)}
.ai-x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink,#222);color:#fff;font-size:1rem;line-height:1;padding:0}
.ai-clip{min-height:46px;padding:0 14px;font-size:1.2rem}
.ai-chips{display:grid;gap:8px}
.ai-chips .ghost{text-align:left;min-height:44px;padding:8px 12px;border-radius:12px;font-weight:500;background:var(--surface)}
.ai-dots{display:flex;gap:5px;padding:14px 16px}
.ai-dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:aib 1s infinite ease-in-out}
.ai-dots i:nth-child(2){animation-delay:.15s}.ai-dots i:nth-child(3){animation-delay:.3s}
@keyframes aib{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.ai-bar .bar-in{align-items:flex-end}
.ai-bar textarea{margin:0;resize:none;min-height:46px;max-height:140px;flex:1;line-height:1.35}
.ai-bar .primary{min-height:46px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;position:relative;min-width:0}
.kpi small{display:block;color:var(--muted);font-weight:600}
.kpi strong{display:block;font-size:1.55rem;line-height:1.15;margin-top:2px}
.kpi p{margin:4px 0 0;color:var(--muted);font-size:.85rem}
.kpi.main{grid-column:1/3;background:linear-gradient(135deg,color-mix(in srgb,var(--leaf) 92%,#000) 0%,var(--leaf) 100%);border:0;color:var(--surface)}
.kpi.main small,.kpi.main p{color:color-mix(in srgb,var(--surface) 80%,transparent)}
.kpi.main strong{font-size:2.3rem;color:var(--surface)}
.kpi.main strong.bad{color:#FFB3C1}

async function photoFromFile(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("This picture can't be opened. Try a JPG or PNG photo.")); i.src = url; });
    const size = 240, c = document.createElement("canvas"); c.width = size; c.height = size;
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, size, size);
    g.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
    let q = 0.82, out = c.toDataURL("image/jpeg", q);
    while (out.length > 40000 && q > 0.35){ q -= 0.1; out = c.toDataURL("image/jpeg", q); }
    if (out.length > 45000) throw new Error("This picture is too detailed. Try a simpler close-up photo.");
    return out;
  } finally { URL.revokeObjectURL(url); }
}
async function billPhotoFromFile(file){   // bill photo for the assistant: longest side 1600 px, JPEG about 0.8
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("This picture can't be opened. Try a JPG or PNG photo.")); i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
    let q = 0.8, out = c.toDataURL("image/jpeg", q);
    while (out.length > 1500000 && q > 0.5){ q -= 0.1; out = c.toDataURL("image/jpeg", q); }   // keep one photo well inside the request size
    return out;
  } finally { URL.revokeObjectURL(url); }
}

/* retry = true: a web page / 404 instead of JSON is tried once more after 2 seconds. Only for saves that are safe to repeat. */
async function remoteJson(request, retry){
  try { return await remoteJsonOnce(request); }
  catch(e){
    if (!(retry && e.notJson)) throw e;
    await new Promise(res => setTimeout(res, 2000));
    return remoteJsonOnce(request);
  }
}
async function remoteJsonOnce(request){
  let r, text;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 90000);   // never leave the app waiting forever
  try { r = await request(ctl.signal); text = await r.text(); }
  catch(e){ throw new Error(e && e.name === "AbortError" ? "The shop server took too long to answer. Try again." : "Couldn't reach the shop server. Check your internet and try again."); }
  finally { clearTimeout(timer); }
  let j; try { j = JSON.parse(text); }
  catch(e){
    const page = (text.match(/<title[^>]*>([^<]*)/i) || [])[1] || text.replace(/<(script|style)[\s\S]*?<\/\1>/gi, " ").replace(/<[^>]+>/g, " ");
    const what = page.replace(/\s+/g, " ").trim().slice(0, 120);
    const err = new Error(`The shop server sent a web page instead of data (code ${r.status}${what ? `: "${what}"` : ""}). In Apps Script, deploy a new version with access set to Anyone, then try again.`);
    err.notJson = true; throw err;
  }
  if (!j.ok) throw new Error(j.error || "Request failed"); return j.data;
}

    const fruits = LS.get("fs_fruits", DEFAULT_FRUITS), orders = LS.get("fs_orders", []);
    const items = p.items.map(i => {

/* ===== Daily book: stock in, stock count, money ===== */
const num = v => Number(v) || 0;

const unitShort = f => f.unit === "kg" || f.unit === "size" ? "kg" : f.unit === "piece" ? "pcs" : "box";
const netOf = f => Number(f.trayNet) || Number(f.trayQty) || 1;
const sellOf = f => Number(f.trayQty) > 0 ? Number(f.trayQty) : netOf(f);   // cost per kg divides by sellable; falls back to net weight
/* A day's entry remembers the net weight and wastage it was bought with (old entries don't, so they use the fruit's current values). */
const netFor = (f, x) => num(x && x.trayNet) || netOf(f);
const sellFor = (f, x) => num(x && x.trayNet) > 0 ? r2(num(x.trayNet) * (1 - (blank(x.wastePct) ? Number(f.wastePct) || 0 : num(x.wastePct)) / 100)) : sellOf(f);
const bookRow = (shop, date) => S.book.find(r => r.shop === shop && r.date === date);
function prevClose(shop, date, fid){
  const rows = S.book.filter(r => r.shop === shop && r.date < date && r.fruits && r.fruits[fid]).sort((a, b) => a.date < b.date ? 1 : -1);
  if (!rows.length) return 0;
  const x = rows[0].fruits[fid];
  return blank(x.close) ? null : Number(x.close);   // last count not done: ask for today's opening
}
function makeDraft(shop, date){

  const base = saved && saved.date === date && saved.shop === shop ? saved : (bookRow(shop, date) || { date, shop, fruits:{}, cash:null, upi:null, expenses:null });
  const d = JSON.parse(JSON.stringify(base));
  S.fruits.forEach(f => {
    const x = d.fruits[f.id] || (d.fruits[f.id] = {});
    if (x.open === undefined) x.open = prevClose(shop, date, f.id);
    if (blank(x.trayCost)) x.trayCost = f.trayCost || null;

function appSales(shop, date){

function calcShop(d){

const vIn = v => blank(v) ? "" : esc(v);
const bkHad = (d, f) => { const x = d.fruits[f.id] || {}; return r1(num(x.open) + num(x.trays) * netFor(f, x)); };
const bkInStock = d => S.fruits.filter(f => { const x = d.fruits[f.id]; return x && (bkHad(d, f) > 0 || blank(x.open) && num(x.trays) > 0); });

/* Morning step: today's tray cost and net weight go into Prices (and prices are saved). Other days are left alone. */
async function syncPricesFromBook(d){
  if (d.date !== ymd(ist())) return;
  const list = JSON.parse(JSON.stringify(S.fruits)); let changed = false;
  list.forEach(f => {
    const x = d.fruits[f.id]; if (!x || !(num(x.trays) > 0)) return;
    const cost = num(x.trayCost), net = num(x.trayNet), before = f.trayCost + "|" + f.trayNet;
    if (cost > 0) f.trayCost = cost;
    if (net > 0) f.trayNet = net;
    if (before !== f.trayCost + "|" + f.trayNet){ applyAuto(f); changed = true; }
  });
  if (!changed) return;
  try { setFruits(await api.saveFruits(S.ownerKey, list.concat(S.goneFruits))); S.editFruits = null; toast("Prices updated from today's tray cost"); }
  catch(e){ toast("The book is saved, but prices were not updated: " + (e.message || "try again from Prices")); }
}
function soldText(f, x){
  if (blank(x.close)) return "";
  const had = r1(num(x.open) + num(x.trays) * netFor(f, x)), sold = r1(had - num(x.close) - num(x.waste));
  if (sold < 0) return `<span class="bad">That's more than you had. Check the numbers.</span>`;
  return `Sold <b>${fmtQty(sold, f.unit)}</b>`;
}

function dayList(end, n){ const [y, m, d] = end.split("-").map(Number); return Array.from({ length:n }, (_, i) => ymd(new Date(y, m - 1, d - (n - 1 - i)))); }
function periodStats(dates){
  const st = { spent:0, profit:0, revenue:0, cash:0, upi:0, app:0, cost:0, wasteCost:0, exp:0, days:0, byShop:{}, byDay:[], fruits:{} };
  CONFIG.SHOPS.forEach(s => st.byShop[s.id] = { revenue:0, profit:0 });
  dates.forEach(ds => {
    let dp = 0, dr = 0, has = false;
    CONFIG.SHOPS.forEach(s => {
      const r = bookRow(s.id, ds); if (!r) return; has = true;
      const c = calcShop(r);
      ["profit","revenue","cash","upi","app","cost","wasteCost","exp","spent"].forEach(k => st[k] += c[k]);
      st.byShop[s.id].revenue += c.revenue; st.byShop[s.id].profit += c.profit; dp += c.profit; dr += c.revenue;
      c.lines.forEach(l => { if (!l.counted) return;
        const F = st.fruits[l.f.id] || (st.fruits[l.f.id] = { f:l.f, sold:0, waste:0, avail:0, value:0, wasteCost:0 });
        F.sold += Math.max(l.sold, 0); F.waste += l.waste; F.avail += l.avail; F.value += Math.max(l.sold, 0) * l.f.price; F.wasteCost += l.lineWaste; });
    });
    if (has) st.days++;
    st.byDay.push({ ds, profit:dp, revenue:dr, has });
  });
  st.wastePct = st.cost + st.wasteCost > 0 ? st.wasteCost / (st.cost + st.wasteCost) * 100 : 0;
  st.appOrders = S.ownerOrders.filter(o => dates.includes(String(o.pickupDate).slice(0,10)) && (o.status === "paid" || o.status === "picked")).length;
  return st;
}
function delta(now, before, lowerIsBetter){
  if (!before) return now ? `<span class="chg">new</span>` : "";
  const pct = Math.round((now - before) / Math.abs(before) * 100);
  if (pct === 0) return `<span class="chg">same</span>`;
  const good = lowerIsBetter ? pct < 0 : pct > 0;
  return `<span class="chg ${good ? "up" : "down"}">${pct > 0 ? "▲" : "▼"} ${Math.abs(pct)}%</span>`;
}
const money = n => (n < 0 ? "− " : "") + rupee(Math.abs(n));
function profitChart(days){
  const W = 340, H = 170, L = 8, R = 8, T = 18, B = 26, iw = W - L - R, ih = H - T - B;
  const vals = days.map(d => d.profit), max = Math.max(1, ...vals.map(v => Math.max(v, 0))), min = Math.min(0, ...vals);
  const span = max - min || 1, y = v => T + (max - v) / span * ih, zero = y(0);
  const bw = iw / days.length, gap = days.length > 14 ? 1.5 : 5;
  const every = days.length > 14 ? 5 : 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Profit per day">
    <line x1="${L}" x2="${W - R}" y1="${zero}" y2="${zero}" class="axis"/>
    ${days.map((d, i) => { const x = L + i * bw + gap / 2, w = bw - gap, top = d.profit >= 0 ? y(d.profit) : zero, hh = Math.max(d.has ? 1.5 : 0, Math.abs(y(d.profit) - zero));
      return `<g data-act="dashDay" data-id="${d.ds}" class="barg">
        <rect x="${(L + i * bw).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent"/>
        ${d.has ? `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="${Math.min(4, w / 3).toFixed(1)}" class="${d.profit < 0 ? "neg" : S.dashDate === d.ds ? "sel" : "pos"}"><title>${niceDate(d.ds)}: ${money(d.profit)}</title></rect>` : `<rect x="${x.toFixed(1)}" y="${zero - 1}" width="${w.toFixed(1)}" height="2" class="none"/>`}
        ${days.length <= 7 && d.has ? `<text x="${(x + w / 2).toFixed(1)}" y="${(d.profit >= 0 ? top - 4 : top + hh + 11).toFixed(1)}" class="val">${Math.abs(d.profit) >= 1000 ? (d.profit / 1000).toFixed(1) + "k" : Math.round(d.profit)}</text>` : ""}
        ${i % every === 0 || i === days.length - 1 ? `<text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" class="lab">${days.length > 14 ? Number(d.ds.slice(8)) : niceDate(d.ds).split(",")[0]}</text>` : ""}
      </g>`; }).join("")}
  </svg>`;
}
function donut(parts){
  const total = parts.reduce((s, p) => s + Math.max(p.value, 0), 0) || 1, r = 42, c = 2 * Math.PI * r;
  let off = 0;
  return `<div class="donut"><svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
      <circle cx="60" cy="60" r="${r}" fill="none" class="track" stroke-width="16"/>
      ${parts.map(p => { const len = Math.max(p.value, 0) / total * c, s = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${p.color}" stroke-width="16" stroke-dasharray="${len.toFixed(2)} ${(c - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`; off += len; return s; }).join("")}
    </svg>
    <ul class="legend">${parts.map(p => `<li><i style="background:${p.color}"></i><span>${esc(p.label)}</span><b>${rupee(p.value)}</b><em>${Math.round(Math.max(p.value, 0) / total * 100)}%</em></li>`).join("")}</ul></div>`;
}

}

function makeSampleBook(){
  const plan = [["pomegranate", 3350, [1, 3]], ["apple", 4200, [1, 2]], ["black-grapes", 1100, [1, 3]], ["orange", 1600, [1, 2]]];
  const rows = [], days = dayList(ymd(ist()), 30);
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  CONFIG.SHOPS.forEach((s, si) => {
    const close = {};
    days.forEach(ds => {
      const row = { date:ds, shop:s.id, fruits:{}, morningDone:true, sample:true }; let rev = 0;
      plan.forEach(([id, cost, [a, b]]) => {
        const f = fruitById(id); if (!f) return;
        const open = close[id] || 0, trays = open > netOf(f) ? 0 : a + Math.floor(rnd() * (b - a + 1)) - si * (rnd() > .6 ? 1 : 0);
        const avail = open + Math.max(trays, 0) * netOf(f);
        const waste = r1(avail * (0.01 + rnd() * 0.06)), sold = r1(avail * (0.65 + rnd() * 0.3)), cl = Math.max(0, r1(avail - sold - waste));
        row.fruits[id] = { open, trays:Math.max(trays, 0), trayCost:cost, close:cl, waste };
        rev += sold * (f.storePrice || f.price) * (0.93 + rnd() * 0.05); close[id] = cl;
      });
      row.cash = Math.round(rev * 0.58); row.upi = Math.round(rev * 0.42); row.expenses = 100 + Math.round(rnd() * 120);
      rows.push(row);
    });
  });
  return rows;
}

function scrollAi(){ const l = document.getElementById("ai-log"); if (l) l.lastElementChild && l.lastElementChild.scrollIntoView({ block:"end" }); window.scrollTo(0, document.body.scrollHeight); }
/* ===== Render ===== */
const VIEWS = { shop:viewShop, checkout:viewCheckout, pay:viewPay, done:viewDone, mine:viewMine, ownerLogin:viewOwnerLogin, owner:viewOwner };
function render(){
  document.getElementById("app").innerHTML = VIEWS[S.view]();
  if (S.view !== S.lastView){ window.scrollTo(0, 0); S.lastView = S.view; }
  if (S.view === "pay") drawQR();
  syncBar();
}
function drawQR(){
  const el = document.getElementById("qr"); if (!el) return;
  const amt = cartTotal().toFixed(2);
  const text = `upi://pay?pa=${encodeURIComponent(CONFIG.UPI_ID)}&pn=${encodeURIComponent(CONFIG.PAYEE)}&am=${amt}&cu=INR`;
  if (window.QRCode){ try { new QRCode(el, { text, width:190, height:190, correctLevel: QRCode.CorrectLevel.M }); return; } catch(e){} }
  el.outerHTML = `<p class="note">QR code can't load right now. Use the UPI ID above.</p>`;
}
function refreshRow(id){
  const it = cartItem(id);
  if (it && it.s){ const z = document.getElementById(`sz-${it.f.id}--${it.s.id}`); if (z) z.querySelector(".qz").innerHTML = sizeQty(it); }
  else { const row = document.querySelector(`#row-${CSS.escape(id)} .qtyzone`); if (row && it) row.innerHTML = qtyZone(it.f); }
  const bar = document.getElementById("cartbar"); if (bar) bar.innerHTML = cartBar();
}
const setErr = m => { const e = document.getElementById("err"); if (e) e.textContent = m; };

/* ===== Actions ===== */
const ACTIONS = {
  async reload(){ S.loadError = ""; await loadFruits(); render(); },
  inc(id){ const it = cartItem(id); if (!it) return; const q = S.cart[id]; S.cart[id] = q ? r1(q + it.step) : 1; refreshRow(id); },
  dec(id){ const it = cartItem(id); if (!it) return; const q = r1((S.cart[id] || 0) - it.step); if (q <= 0) delete S.cart[id]; else S.cart[id] = q; refreshRow(id); },
  async go(view){
    if ((view === "checkout" || view === "pay") && !cartLines().length) view = "shop";
    S.view = view;
    if (view === "mine"){ S.mine = null; render(); try { S.mine = { list: await api.status(S.myOrders) }; } catch(e){ S.mine = { error: "Couldn't load your orders. Check your internet connection." }; } }
    if (view === "ownerLogin" && S.ownerKey){ return ACTIONS.ownerLogin(S.ownerKey); }
    render();
  },
  toPay(){
    const name = document.getElementById("f-name").value.trim();
    const phone = document.getElementById("f-phone").value.replace(/\D/g, "");

  async copyUpi(){
    try { await navigator.clipboard.writeText(CONFIG.UPI_ID); toast("UPI ID copied"); }
    catch(e){ toast("Copy didn't work. Type the UPI ID: " + CONFIG.UPI_ID); }
  },
  async placeOrder(_, __, btn){
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Booking…";
    try {
      const res = await api.placeOrder({ ...S.customer, items: cartLines().map(l => l.size ? { id:l.id, size:l.size, qty:l.qty } : { id:l.id, qty:l.qty }) });
      S.myOrders = [res.id, ...S.myOrders.filter(x => x !== res.id)].slice(0, 20); LS.set("fs_my", S.myOrders);

  },
  async ownerLogin(keyArg){
    const key = typeof keyArg === "string" && keyArg ? keyArg : (document.getElementById("f-key") || {}).value || "";
    try {
      S.ownerOrders = await api.orders(key);
      S.book = await api.book(key);
      S.ownerKey = key; LS.set("fs_owner", key); S.view = "owner"; render();
    } catch(e){
      S.ownerKey = ""; LS.set("fs_owner", ""); S.view = "ownerLogin"; render(); setErr(e.message || "Couldn't open the owner screen.");
    }
  },
  ownerLogout(){ S.ownerKey = ""; LS.set("fs_owner", ""); S.ownerOrders = []; S.editFruits = null; S.view = "shop"; render(); },
  ownerTab(tab){ S.ownerTab = tab; if (tab === "book"){ S.bookStep = ist().getHours() >= 16 ? 2 : 1; S.bookSub = null; } if (tab === "fruits"){ S.editFruits = null; S.editOpen = null; } if (tab === "book") S.bookDraft = null; render(); },
  aiChip(_, text){ S.aiDraft = text; render(); const t = document.getElementById("ai-in"); if (t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } },
  aiReset(){ S.ai = []; S.aiAct = {}; S.aiQueue = []; S.aiDraft = ""; S.aiPhoto = ""; aiSave(); render(); },
  async aiConfirm(i, _, btn){
    const m = S.ai[Number(i)]; if (!m || Number(i) !== aiLatestCard()) return; btn.disabled = true;
    const tools = (m.content || []).filter(b => b.type === "tool_use");
    let ok = 0;
    const fail = (t, msg, pre) => { S.aiAct[t.id] = { s:"error", msg }; S.aiQueue.push({ type:"tool_result", tool_use_id:t.id, content:(pre || "Failed: ") + msg, is_error:true }); };
    const done = t => { S.aiAct[t.id] = { s:"applied" }; S.aiQueue.push({ type:"tool_result", tool_use_id:t.id, content:"Saved after the owner confirmed." }); ok++; };
    const pending = tools.filter(t => !S.aiAct[t.id] || S.aiAct[t.id].s === "pending");
    // Daily book changes for the same shop and day share one draft and one save
    const groups = {}, handled = new Set(), keyOf = t => t.input.shop + "|" + t.input.date;
    for (const t of pending){
      if (!AI_BOOK_TOOLS.includes(t.name)) continue;
      const g = groups[keyOf(t)] || (groups[keyOf(t)] = { shop:t.input.shop, date:t.input.date, items:[] });
      let bad = aiValidate(t);
      if (bad && t.name === "clear_fruit_entry" && g.items.some(x => x.input.fruit_id === t.input.fruit_id)) bad = null;   // set earlier on this same card
      if (bad){ fail(t, bad, "Not saved: "); handled.add(t.id); } else g.items.push(t);
    }
    for (const t of pending){
      if (handled.has(t.id)) continue;
      if (AI_BOOK_TOOLS.includes(t.name)){
        const g = groups[keyOf(t)]; g.items.forEach(x => handled.add(x.id));
        try { await aiBookPatchMany(g.shop, g.date, g.items.map(aiBookFn)); g.items.forEach(done); }
        catch(e){ g.items.forEach(x => fail(x, e.message)); }
        continue;
      }
      const bad = aiValidate(t);
      if (bad){ fail(t, bad, "Not saved: "); continue; }
      try { await aiApply(t); done(t); } catch(e){ fail(t, e.message); }
    }
    aiSave(); render(); scrollAi(); if (ok) toast(`Saved ${ok} ${ok === 1 ? "change" : "changes"}`);
  },
  aiCancel(i){
    const m = S.ai[Number(i)]; if (!m || Number(i) !== aiLatestCard()) return;
    (m.content || []).filter(b => b.type === "tool_use").forEach(t => { if (!S.aiAct[t.id] || S.aiAct[t.id].s === "pending"){ S.aiAct[t.id] = { s:"cancelled" }; S.aiQueue.push({ type:"tool_result", tool_use_id:t.id, content:"The owner cancelled this. Nothing was saved." }); } });
    aiSave(); render(); scrollAi();
  },
  aiPickPhoto(){ const f = document.getElementById("ai-file"); if (!f) return; f.value = ""; try { f.click(); } catch(e){ toast("This browser can't open photos. Open the app link in Chrome or Safari."); } },
  aiPhotoRemove(){ S.aiPhoto = ""; render(); const t = document.getElementById("ai-in"); if (t) t.focus(); },
  async aiSend(){
    const box = document.getElementById("ai-in"), photo = S.aiPhoto || "";
    let text = (box ? box.value : "").trim();
    if ((!text && !photo) || S.aiBusy) return;
    if (!text) text = "Please read this bill.";
    const last = S.ai[S.ai.length - 1];
    if (last && last.role === "assistant" && Array.isArray(last.content))
      last.content.filter(b => b.type === "tool_use").forEach(t => { if (!S.aiAct[t.id] || S.aiAct[t.id].s === "pending"){ S.aiAct[t.id] = { s:"cancelled" }; S.aiQueue.push({ type:"tool_result", tool_use_id:t.id, content:"The owner moved on without confirming. Nothing was saved." }); } });
    const queued = S.aiQueue.slice();
    const userMsg = { role:"user", content:[...queued, ...(photo ? [{ type:"image", source:{ type:"base64", media_type:"image/jpeg", data:photo.split(",")[1] } }] : []), { type:"text", text }] };
    S.ai.push(userMsg); S.aiQueue = []; S.aiDraft = ""; S.aiPhoto = ""; S.aiBusy = true; aiSave(); render(); scrollAi();
    try {
      const res = await aiCall();
      if (!(res.content || []).some(b => (b.type === "text" && String(b.text || "").trim()) || b.type === "tool_use")) throw new Error("The assistant sent an empty answer. Try again.");
      userMsg.content = userMsg.content.map(b => b.type === "image" ? { type:"text", text:"[bill photo]" } : b);   // keep later requests small
      S.ai.push({ role:"assistant", content:res.content });
      (res.content || []).filter(b => b.type === "tool_use").forEach(t => { S.aiAct[t.id] = { s:"pending" }; });
    } catch(e){
      if (AI_HISTORY_ERROR.test(String(e && e.message))){   // the saved chat is out of step with what the API accepts: start fresh, keep the typed message
        S.ai = []; S.aiAct = {}; S.aiQueue = []; S.aiDraft = text; S.aiPhoto = photo; S.aiBusy = false; aiSave(); render(); setErr("Chat reset after an error. Your saved data is safe."); return;
      }
      S.ai.pop(); S.aiQueue = queued; S.aiDraft = text; S.aiPhoto = photo; S.aiBusy = false; aiSave(); render(); setErr(e.message || "The assistant didn't answer. Try again."); return;
    }
    S.aiBusy = false; aiSave(); render(); scrollAi();
  },
  dashDays(n){ S.dashDays = Number(n); render(); },
  dashDay(ds){ S.dashDate = ds; render(); const el = document.getElementById("dash-day"); if (el) el.scrollIntoView({ behavior:"smooth", block:"start" }); },
  openBook(shop, ds){ S.bookShop = shop; S.bookDate = ds; S.bookDraft = null; S.ownerTab = "book"; S.bookStep = 4; S.bookSub = null; render(); window.scrollTo(0, 0); },
  clearSample(){ S.book = S.book.filter(r => !r.sample); LS.set("fs_book", S.book); render(); toast("Sample data cleared"); },
  async sampleData(){
    if (REMOTE()) return;
    S.book = makeSampleBook(); LS.set("fs_book", S.book); render(); toast("Sample data added on this phone. Clear it before real use.");
  },
  bkShop(id){ S.bookShop = id; S.bookDraft = null; render(); },
  bkDay(id){ S.bookDate = id; S.bookDraft = null; render(); },
  bkStep(n, arg){ S.bookStep = Number(n); S.bookSub = arg || null; render(); window.scrollTo(0, 0); },
  bkBack(){
    const d = S.bookDraft, step = S.bookStep || 1, q = bkSeq(step, d), i = q.indexOf(bkSubNow(step, d));
    if (i > 0) S.bookSub = q[i - 1]; else if (step > 1){ S.bookStep = step - 1; const pq = bkSeq(step - 1, d); S.bookSub = pq[pq.length - 1]; }
    render(); window.scrollTo(0, 0);
  },
  bkLeft(fid, k){ const f = fruitById(fid), x = S.bookDraft.fruits[fid]; x.close = r1(bkHad(S.bookDraft, f) * Number(k)); LS.set("fs_bkdraft", S.bookDraft); render(); },
  bkShare(){
    const d = S.bookDraft, plan = tomorrowPlan(d), lines = orderLines(plan); if (!lines.length) return;
    const text = `Fruit order for ${shopShort(d.shop)}, ${niceDate(plan.tomorrow)}:\n${lines.join("\n")}`;
    window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener");
  },
  bkTray(fid, delta){
    const x = S.bookDraft.fruits[fid]; x.trays = Math.max(0, r1(num(x.trays) + Number(delta)));
    if (x.trays > 0 && blank(x.trayCost)) x.trayCost = (fruitById(fid) || {}).trayCost || null;
    S.bkMoreOpen = !!(document.getElementById("bk-more") || {}).open;
    LS.set("fs_bkdraft", S.bookDraft); render();
  },
  async bkNext(_, __, btn){
    const d = S.bookDraft, step = S.bookStep || 1, q = bkSeq(step, d), i = q.indexOf(bkSubNow(step, d)), last = i >= q.length - 1;
    const go = (st, sub) => { S.bookStep = st; S.bookSub = sub; render(); window.scrollTo(0, 0); };
    if (step === 1){
      d.morningDone = true; const snap = JSON.parse(JSON.stringify(d));
      if (await ACTIONS.saveBook(_, __, btn, true)){ go(2, null); await syncPricesFromBook(snap); }
    } else if (step === 2){
      if (!last){ LS.set("fs_bkdraft", d); go(2, q[i + 1]); }
      else if (await ACTIONS.saveBook(_, __, btn, true)) go(3, null);
    } else if (step === 3){
      if (!last){ go(3, q[i + 1]); }
      else { (S.bkSeen = S.bkSeen || {})[d.shop + d.date] = true; go(4, null); }
    } else await ACTIONS.saveBook(_, __, btn, true);
  },
  async saveBook(_, __, btn, quiet){
    const d = JSON.parse(JSON.stringify(S.bookDraft));
    Object.keys(d.fruits).forEach(id => { const x = d.fruits[id]; if (num(x.open) === 0 && !num(x.trays) && blank(x.close) && !num(x.waste)) delete d.fruits[id]; });
    d.updated = new Date().toISOString();
    btn.disabled = true;
    try {
      await api.saveBook(S.ownerKey, d);
      S.book = S.book.filter(r => !(r.date === d.date && r.shop === d.shop)).concat([d]);
      LS.set("fs_bkdraft", null); S.bookDraft = null; render(); toast("Saved");
      return true;
    } catch(e){ btn.disabled = false; setErr(e.message || "Couldn't save. Check your internet and try again."); return false; }
  },
  async refresh(){
    try { S.ownerOrders = await api.orders(S.ownerKey); S.book = await api.book(S.ownerKey); setFruits(await api.fruits()); S.editFruits = null; S.editGone = null; S.bookDraft = null; render(); toast("Up to date"); }
    catch(e){ toast(e.message || "Couldn't refresh"); }
  },
  async setStatus(id, status, btn){
    btn.disabled = true;
    try {
      await api.updateOrder(S.ownerKey, id, status);
      const o = S.ownerOrders.find(x => x.id === id); if (o) o.status = status;
      render(); toast(STATUS_OWNER[status]);
    } catch(e){ btn.disabled = false; toast(e.message || "Couldn't update the order"); }
  },
  addFruit(){
    const val = id => document.getElementById(id).value.trim();
    const err = m => { document.getElementById("nf-err").textContent = m; };
    const name = val("nf-name"), te = val("nf-te");
    const unit = (document.querySelector('input[name="nf-unit"]:checked') || {}).value || "kg";
    const price = Number(val("nf-price")), net = Number(val("nf-net")), waste = val("nf-waste") === "" ? WASTE_PCT : Number(val("nf-waste")), cost = Number(val("nf-cost")) || 0;
    const color = (document.querySelector('input[name="nf-color"]:checked') || {}).value || PALETTE[0];
    if (!name) return err("Enter the fruit name.");
    if (S.editFruits.some(f => f.name.toLowerCase() === name.toLowerCase())) return err(`${name} is already in the list.`);
    if (!(price > 0) && !(cost > 0)) return err("Enter a price, or a tray cost to set the price automatically.");
    if (!(net > 0)) return err("Enter how much one tray holds.");
    if (!(waste >= 0 && waste < 100)) return err("Wastage must be between 0 and 50%.");
    let id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "fruit";
    const baseId = id; let n = 2; while (S.editFruits.some(f => f.id === id)) id = baseId + "-" + n++;
    S.editFruits.push({ id, name, te, unit, price, step: unit === "kg" ? 0.5 : 1, trayQty: net, trayNet: net, wastePct: waste, trayCost: cost, color, active: true, boxSize: unit === "box" ? val("nf-box") : "", photo: S.newPhoto || "", _new: true,
      sizes: unit === "size" ? [{ id:"s1", name:"Small", min:1, max:2 }, { id:"s2", name:"Medium", min:2, max:3 }, { id:"s3", name:"Large", min:3, max:4 }] : [],
      profitPct: PROFIT_PCT, storePct: STORE_PCT, auto: cost > 0, storePrice: Math.ceil(price * (1 + STORE_PCT / 100)) });
    applyAuto(S.editFruits[S.editFruits.length - 1]);
    S.newPhoto = ""; S.addOpen = false; S.fruitsDirty = true;
    render(); toast(unit === "size" ? `${name} added. Set its sizes, then press Save prices.` : `${name} added. Press Save prices to keep it.`);
    const card = document.querySelector(`[data-fid="${CSS.escape(id)}"]`); if (card) card.scrollIntoView({ block:"center" });
  },
  applyAllPct(){
    const w = Number(document.getElementById("all-waste").value), p = Number(document.getElementById("all-profit").value), s = Number(document.getElementById("all-store").value);
    if (!(w >= 0 && w < 100) || !(p >= 0) || !(s >= 0)) return toast("Enter wastage, profit and shop percentages.");
    S.editFruits.forEach(f => { f.wastePct = w; if (f.auto){ f.profitPct = p; f.storePct = s; } applyAuto(f); });
    if (S.editFruits.length) S.fruitsDirty = true;
    render(); toast(`Updated ${S.editFruits.length} ${S.editFruits.length === 1 ? "fruit" : "fruits"}. Press Save prices to keep it.`);
  },
  addSize(fid){
    const f = S.editFruits.find(x => x.id === fid); if (!f) return;
    let n = (f.sizes || []).length + 1; while ((f.sizes || []).some(s => s.id === "s" + n)) n++;
    const last = (f.sizes || [])[f.sizes.length - 1];
    f.sizes = [...(f.sizes || []), { id:"s" + n, name:"", min: last ? last.max : 1, max: last ? r1(last.max + 1) : 2 }];
    S.fruitsDirty = true; render();
  },
  removeSize(fid, idx){
    const f = S.editFruits.find(x => x.id === fid); if (!f) return;
    if (f.sizes.length <= 1) return toast("Keep at least one size.");
    f.sizes.splice(Number(idx), 1); S.fruitsDirty = true; render();
  },
  pickPhoto(key, src){
    const inp = document.querySelector(`input[data-photo="${CSS.escape(key)}"][data-src="${src}"]`);
    if (!inp){ toast("Photo picker not found. Reload the app and try again."); return; }
    inp.value = "";
    try { if (inp.showPicker) inp.showPicker(); else inp.click(); }
    catch(e){ try { inp.click(); } catch(e2){ toast("This browser can't open photos. Open the app link in Chrome or Safari."); } }
  },
  toggleEdit(id){ S.editOpen = S.editOpen === id ? null : id; render(); },
  setColor(id, color){ const f = S.editFruits.find(x => x.id === id); if (f){ f.color = color; S.fruitsDirty = true; render(); } },
  removePhoto(id){
    if (id === "__new"){ S.newPhoto = ""; S.addOpen = true; render(); return; }
    const f = S.editFruits.find(x => x.id === id); if (f){ f.photo = ""; S.fruitsDirty = true; render(); toast("Photo removed. Press Save prices to keep this."); }
  },
  deleteFruit(id){
    const f = S.editFruits.find(x => x.id === id); if (!f) return;
    if (!confirm(`Delete ${f.name}? Its past Daily book records stay, but it will disappear from the app.`)) return;
    S.editFruits = S.editFruits.filter(x => x.id !== id);
    if (!f._new){ const { _new, ...keep } = f; (S.editGone = S.editGone || []).push(keep); }
    S.editOpen = null; S.fruitsDirty = true; render(); toast("Deleted. Press Save prices to keep this.");
  },
  removeNewFruit(id){ S.editFruits = S.editFruits.filter(f => !(f.id === id && f._new)); S.fruitsDirty = true; render(); },
  async saveFruits(_, __, btn){
    const fail = m => { setErr(m); toast(m); return false; };
    const noName = S.editFruits.find(f => !String(f.name || "").trim());
    if (noName) return fail("Every fruit needs a name.");
    const bad = S.editFruits.find(f => f.active && (!(f.price > 0) || !(f.trayQty > 0)));
    for (const f of S.editFruits.filter(x => x.active && isSize(x))){
      if (!f.sizes || !f.sizes.length) return fail(`${f.name} needs at least one size.`);
      const bs = f.sizes.find(s => !String(s.name).trim() || !(s.min > 0) || !(s.max >= s.min));
      if (bs) return fail(`${f.name}: check the sizes. Each needs a name, and "to kg" must be at least "from kg".`);
    }
    const autoMissing = S.editFruits.find(f => f.active && f.auto && !autoPrices(f));
    if (autoMissing) return fail(`${autoMissing.name} needs a tray cost and net weight for automatic prices.`);
    if (bad) return fail(`${bad.name} needs a price and a tray size, or turn it off.`);
    if (btn) btn.disabled = true;
    S.editFruits.forEach(f => { applyAuto(f); if (!(Number(f.storePrice) > 0)) f.storePrice = f.price; });
    const clean = S.editFruits.map(({ _new, ...f }) => f).concat((S.editGone || []).map(f => ({ ...f, deleted:true, active:false })));
    try { setFruits(await api.saveFruits(S.ownerKey, clean)); S.editFruits = null; S.editGone = null; S.fruitsDirty = false; render(); toast("Prices saved"); return true; }
    catch(e){ if (btn) btn.disabled = false; fail(e.message || "Couldn't save prices."); return false; }
  }
};
/* Leaving Prices with unsaved edits: ask first. Yes = save (same checks as Save prices) then continue; No = discard and continue. */
const LEAVES_PRICES = new Set(["go", "refresh", "ownerLogout", "ownerTab"]);
async function leavePrices(run){
  if (confirm("You have unsaved changes in Prices. Save them now?")){
    if (!(await ACTIONS.saveFruits(null, null, null))) return;
  } else { S.editFruits = null; S.editGone = null; S.fruitsDirty = false; }
  run();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const fn = ACTIONS[b.dataset.act]; if (!fn) return;
  if (LEAVES_PRICES.has(b.dataset.act) && pricesDirty()) return leavePrices(() => fn(b.dataset.id, b.dataset.arg, b, e));
  fn(b.dataset.id, b.dataset.arg, b, e);
});
document.addEventListener("input", e => {
  const el = e.target, card = el.closest(".fedit"); if (!card || !el.dataset.field || !S.editFruits) return;
  const f = S.editFruits.find(x => x.id === card.dataset.fid); if (!f) return;
  f[el.dataset.field] = el.type === "checkbox" ? el.checked : el.dataset.text ? el.value : Number(el.value);
  applyAuto(f); markDirty(); syncOnSale(card, f);
  if (el.dataset.field === "auto"){ if (!f.auto && !f.storePrice) f.storePrice = Math.ceil(f.price * (1 + (f.storePct || STORE_PCT) / 100)); render(); return; }
  card.querySelector("[data-profit]").textContent = profitText(f);
  const sl = card.querySelector("[data-sellable]"); if (sl) sl.textContent = sellableText(f);
  const ap = card.querySelector("[data-autoprice]"); if (ap) ap.innerHTML = autoPriceText(f);
  if (isSize(f)) (f.sizes || []).forEach((s, i) => { const el2 = card.querySelector(`[data-szp="${CSS.escape(f.id + "|" + i)}"]`); if (el2) el2.innerHTML = szPriceText(f, s); });
});
document.addEventListener("input", e => {
  const el = e.target, k = el.dataset && el.dataset.size; if (!k || !S.editFruits) return;
  const [fid, idx, field] = k.split("|"), f = S.editFruits.find(x => x.id === fid); if (!f) return;
  const s = f.sizes[Number(idx)]; if (!s) return;
  s[field] = field === "name" ? el.value : Number(el.value); markDirty();
  const out = document.querySelector(`[data-szp="${CSS.escape(fid + "|" + idx)}"]`); if (out) out.innerHTML = szPriceText(f, s);
});
document.addEventListener("input", e => {
  const el = e.target, key = el.dataset && el.dataset.bk; if (!key || !S.bookDraft) return;
  const v = el.value === "" ? null : Number(el.value), parts = key.split(":");
  if (parts[0] === "f") S.bookDraft.fruits[parts[1]][parts[2]] = v; else S.bookDraft[parts[1]] = v;
  LS.set("fs_bkdraft", S.bookDraft);
  if (parts[0] === "f"){
    const f = fruitById(parts[1]), x = S.bookDraft.fruits[parts[1]];
    const sold = document.querySelector(`[data-sold="${CSS.escape(parts[1])}"]`); if (sold) sold.innerHTML = soldText(f, x);
    if (parts[2] === "close"){
      document.querySelectorAll(".bk-opts button").forEach(b => b.classList.toggle("on", !blank(x.close) && Math.abs(num(x.close) - bkHad(S.bookDraft, f) * Number(b.dataset.arg)) < 0.06));
      el.closest(".bk-item").classList.toggle("ok", !blank(x.close));
      const items = document.querySelectorAll(".bk-body [data-sold]"), n = items.length;
      const c = [...items].filter(i => !blank(S.bookDraft.fruits[i.dataset.sold].close)).length;
      const bar = document.querySelector(".bk-progress span"), txt = document.getElementById("bk-count");
      if (bar) bar.style.width = Math.round(c / n * 100) + "%"; if (txt) txt.textContent = `Counted ${c} of ${n}`;
    }
  }
});
document.addEventListener("input", e => {
  if (e.target.id !== "ai-in") return;
  S.aiDraft = e.target.value; e.target.style.height = "auto"; e.target.style.height = Math.min(140, e.target.scrollHeight) + "px";
});
/* A pasted image (Ctrl+V, or long-press Paste on a phone) is treated exactly like one chosen with the paperclip. Pasted text works as normal. */
function aiAttachPhoto(file){
  toast("Preparing photo…");
  billPhotoFromFile(file).then(data => { S.aiPhoto = data; render(); const t = document.getElementById("ai-in"); if (t) t.focus(); }).catch(err => toast(err.message));
}
document.addEventListener("paste", e => {
  if (e.target.id !== "ai-in" || S.aiBusy) return;
  const cd = e.clipboardData; if (!cd) return;
  const file = [...(cd.files || [])].find(f => f.type.startsWith("image/")) || [...(cd.items || [])].filter(i => i.kind === "file" && i.type.startsWith("image/")).map(i => i.getAsFile()).find(Boolean);
  if (!file) return;
  e.preventDefault();
  aiAttachPhoto(file);
});
document.addEventListener("keydown", e => {
  if (e.target.id === "ai-in" && e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); ACTIONS.aiSend(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "ai-file"){
    const file = e.target.files && e.target.files[0]; if (file) aiAttachPhoto(file);
    return;
  }
  if (e.target.id === "dash-date" && e.target.value){ S.dashDate = e.target.value; render(); return; }
  if (e.target.id === "b-date" && e.target.value){ S.bookDate = e.target.value; S.bookDraft = null; render(); }
  if (e.target.id === "b-shop"){ S.bookShop = e.target.value; S.bookDraft = null; render(); }
  if (e.target.id === "o-date" && e.target.value){ S.ownerDate = e.target.value; render(); }
  if (e.target.id === "o-shop"){ S.ownerShop = e.target.value; render(); }
  if (e.target.dataset && e.target.dataset.photo && e.target.files && e.target.files[0]){
    const key = e.target.dataset.photo, file = e.target.files[0];
    toast("Preparing photo…");
    photoFromFile(file).then(data => {
      if (key === "__new"){ S.newPhoto = data; S.addOpen = true; }
      else { const f = S.editFruits && S.editFruits.find(x => x.id === key); if (f){ f.photo = data; S.fruitsDirty = true; } }
      render(); toast(key === "__new" ? "Photo ready" : "Photo added. Press Save prices to keep it.");
    }).catch(err => toast(err.message));
    return;
  }
  if (e.target.name === "nf-unit"){ const w = document.getElementById("nf-boxwrap"); if (w) w.hidden = e.target.value !== "box"; }
  if (e.target.matches('.fedit input[type="checkbox"]')) e.target.dispatchEvent(new Event("input", { bubbles:true }));
});

/* ===== Start ===== */
async function loadFruits(){
  try { setFruits(await api.fruits()); }
  catch(e){ S.loadError = e.message || "load failed"; }
}
(async function init(){
  await loadFruits(); render();
  setInterval(() => { const c = document.getElementById("clock"); if (c) c.textContent = clockText(); }, 30000);
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
